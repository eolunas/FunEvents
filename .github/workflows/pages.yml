# Publica docs/ en GitHub Pages.
#
# Requiere activarlo una vez en el repositorio:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# No hay paso de build: docs/index.html es un unico HTML autocontenido, asi que
# el despliegue es una copia. Que no haya generador estatico es deliberado: el
# documento se puede abrir tambien con doble clic desde el repositorio clonado,
# sin depender de que Pages este activo.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion a la vez. No se cancelan las que ya estan en curso: dejar un
# despliegue a medias es peor que esperar a que termine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
